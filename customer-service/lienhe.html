<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSKH Coffee Sông Hậu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Màn hình chờ mở đầu -->
    <div id="intro-screen">
        <div class="intro-content">
            <img src="img/LogoSH.png" alt="Coffee Sông Hậu Logo" class="intro-logo">
            <h2 class="intro-text">COFFEE SÔNG HẬU</h2>
        </div>
    </div>

    <!-- Giao diện chính -->
    <div class="card main-content hidden">
        
        <!-- Nút Menu 3 gạch ngang -->
        <button class="menu-toggle-btn" id="menuToggleBtn" aria-label="Mở menu">
            <i class="fas fa-bars"></i>
        </button>

        <!-- Menu Trượt -->
        <div class="side-menu" id="sideMenu">
            <div class="side-menu-header">
                <h3>Tiện ích Sông Hậu</h3>
                <button class="close-menu-btn" id="closeMenuBtn"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="side-menu-list">
                <a href="thucdon.html" class="side-menu-item">
                    <div class="icon-wrap"><i class="fas fa-book-open"></i></div>
                    <span>Thực đơn & Món mới</span>
                </a>
                <a href="danhgiadichvu.html" class="side-menu-item">
                    <div class="icon-wrap"><i class="fas fa-star"></i></div>
                    <span>Đánh giá dịch vụ</span>
                </a>
                <a href="chatbot.html" class="side-menu-item">
                    <div class="icon-wrap"><i class="fas fa-star"></i></div>
                    <span>Chát BOT A.I</span>
                </a>
                <hr class="menu-divider">
                
                <!-- Nút chuyển đổi Giao diện Tối/Sáng -->
                <button class="side-menu-item theme-toggle" id="themeToggleBtn">
                    <div class="icon-wrap"><i class="fas fa-moon" id="themeIcon"></i></div>
                    <span id="themeText">Giao diện tối</span>
                </button>
            </div>
        </div>
        <!-- Lớp phủ khi mở menu -->
        <div class="menu-overlay" id="menuOverlay"></div>

        <!-- Nội dung Card -->
        <div class="logo">
            <img src="img/LogoSH.png" alt="Logo" class="card-logo-img">
        </div>

        <h1>COFFEE SÔNG HẬU</h1>
        <div class="subtitle">Chăm sóc khách hàng</div>

        <div class="contact-list">
            <a href="tel:0852494694" class="contact-item">
                <div class="icon"><i class="fas fa-phone-alt"></i></div>
                <div class="info">
                    <strong>Gọi Hotline</strong>
                    <span>0852 494 694</span>
                </div>
                <i class="fas fa-chevron-right arrow"></i>
            </a>

            <a href="https://zalo.me/0852494694" class="contact-item">
                <div class="icon"><i class="fas fa-comments"></i></div>
                <div class="info">
                    <strong>Zalo CSKH</strong>
                    <span>Nhắn tin trực tiếp</span>
                </div>
                <i class="fas fa-chevron-right arrow"></i>
            </a>

            <a href="https://www.facebook.com/profile.php?id=61585402033689" target="_blank" class="contact-item">
                <div class="icon"><i class="fab fa-facebook-f"></i></div>
                <div class="info">
                    <strong>Facebook</strong>
                    <span>Coffee Sông Hậu</span>
                </div>
                <i class="fas fa-chevron-right arrow"></i>
            </a>

            <a href="https://www.coffeesonghau.com" target="_blank" class="contact-item">
                <div class="icon"><i class="fas fa-globe"></i></div>
                <div class="info">
                    <strong>Website chính thức</strong>
                    <span>coffeesonghau.com</span>
                </div>
                <i class="fas fa-chevron-right arrow"></i>
            </a>
        </div>

        <div class="status">
            <span class="dot"></span>
            Bộ phận CSKH luôn sẵn sàng lắng nghe
        </div>

        <div class="footer">
            © 2026 Coffee Sông Hậu
        </div>
    </div>

    <!-- Bong bóng gấu Mascot -->
    <a href="tel:0852494694" class="coffee-mascot">
        <img src="img/Gaucoffee.png" alt="Gọi ngay">
    </a>

    <script src="script.js"></script>
</body>
</html>
