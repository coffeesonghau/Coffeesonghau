<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực đơn - Coffee Sông Hậu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #8B4513;
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --text-main: #2d2d2d;
            --text-sub: #777777;
            --border-color: #ececec;
            --item-bg: #f7f7f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        .sticky-top {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .header {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            color: var(--text-main);
            font-size: 20px;
            text-decoration: none;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--item-bg);
            transition: 0.2s;
        }

        .back-btn:hover {
            background: var(--primary-color);
            color: #fff;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .header-spacer { width: 40px; }

        /* --- THANH TÌM KIẾM MỚI THÊM --- */
        .search-box {
            padding: 0 20px 10px 20px;
        }
        
        .search-input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }
        
        .search-input:focus {
            border-color: var(--primary-color);
        }

        .branch-picker {
            padding: 0 20px 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .branch-picker label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-sub);
            white-space: nowrap;
        }

        .branch-picker select {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            background: var(--item-bg);
            color: var(--primary-color);
            font-size: 14px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .categories {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .categories::-webkit-scrollbar { display: none; }

        .cat-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: #fff;
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cat-btn.active {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 4px 10px rgba(139, 69, 19, 0.2);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 15px 20px 30px 20px;
            background: #fff;
        }

        /* Khi không có món */
        .empty-state {
            grid-column: span 2;
            text-align: center;
            padding: 40px 20px;
            color: var(--text-sub);
            font-size: 14px;
        }

        .empty-state i {
            font-size: 40px;
            color: #ccc;
            margin-bottom: 10px;
        }

        .menu-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .item-img {
            width: 100%;
            height: 140px;
            background-color: #f0f0f0;
            object-fit: cover;
        }

        .item-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .item-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-price-row {
            margin-top: auto;
            display: flex;
            align-items: center;
        }

        .item-price {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary-color);
            transition: all 0.3s ease;
        }

        /* --- HIỆU ỨNG CHỚP GIÁ KHI ĐỔI CHI NHÁNH --- */
        .price-flash {
            animation: flashHighlight 2s ease;
        }

        @keyframes flashHighlight {
            0% { color: var(--primary-color); transform: scale(1); }
            50% { color: #16a34a; transform: scale(1.15); } /* Nháy màu xanh lá */
            100% { color: var(--primary-color); transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="sticky-top">
        <header class="header">
            <a href="lienhe.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
            <div class="header-title">Thực Đơn Quán</div>
            <div class="header-spacer"></div>
        </header>

        <!-- Ô Tìm kiếm -->
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Hôm nay bạn muốn tìm món gì?">
        </div>

        <div class="branch-picker">
            <label for="branchSelect">📍 Chi nhánh:</label>
            <select id="branchSelect">
                <option value="goc">chi nhánh... </option>
                <option value="chinhanh3">Sông hậu Coffee</option>
                <option value="chinhanh1">Sông Hậu Special</option>
                <option value="chinhanh2">Sông Hậu Tân Tạo</option>
            </select>
        </div>

        <nav class="categories">
            <button class="cat-btn active" data-filter="all">Tất cả</button>
            <button class="cat-btn" data-filter="bestseller">Best seller</button>
            <button class="cat-btn" data-filter="cafe">Cà Phê</button>
            <button class="cat-btn" data-filter="nuocngot">Nước Ngọt</button>
            <button class="cat-btn" data-filter="other">Khác...</button>
        </nav>
    </div>

    <main class="menu-grid" id="menuGrid"></main>

    <script src="thucdon.js"></script>

</body>
</html>
